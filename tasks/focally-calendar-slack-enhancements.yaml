# Parche Focally Calendar Slack Enhancements v0.9.4

## Resumen
Dar control total al usuario sobre informacion del calendario en Slack.
Control de mostrar titulo de eventos por FocusMode.
Deteccion automatica de video calls con DND opcional.
Extraccion de emojis del titulo del evento para status Slack.
Configuracion global de Slack para calendar integration.

## Requerimientos funcionales

### 1. Control de mostrar titulo por FocusMode

Nuevo enum CalendarTitleDisplay.
  - showFullTitle titulo completo de la reunion.
  - showVideoCallOnly solo En video llamada.
  - hideTitle no mostrar titulo.

UI en FocusModeEditSheet.
  Section Calendario con Picker para las 3 opciones.

Logica.
  - showFullTitle usa titulo completo del evento de EventKit.
  - showVideoCallOnly muestra En video llamada si es video call y En reunion si no.
  - hideTitle solo muestra emoji sin texto de titulo.

### 2. Deteccion de video calls y DND opcional

Nuevo servicio CalendarEventAnalyzer.
  - analyzeMeetingType event detecta tipo de reunion.
  - isVideoCall event boolean si es video call.

Criterios de deteccion prioridad.
  - 1. EventKit location contiene URL de video call.
  - 2. EventKit URL property.
  - 3. Keywords en titulo meet zoom call video teams meet.

Nuevo toggle global en Slack settings.
  - activateDNDForVideoCalls Bool false.

UI en Slack Settings.
  Section Calendario con Toggle Activar DND para video calls.

Logica de DND.
  - Si activateDNDForVideoCalls es true.
    - Detectar evento activo al iniciar sesion.
    - Si isVideoCall es true activar DND.
    - Si evento termina desactivar DND.
  - Si activateDNDForVideoCalls es false.
    - Comportamiento actual DND controlado por FocusMode.

### 3. Emojis del evento de calendario

Nuevo servicio EmojiExtractor.
  - extractAllEmojis from String String array.
  - concatenate emojis String array String.

Logica.
  - Parsear texto buscando emojis Unicode.
  - Mantener orden de aparicion.
  - NO extraer emojis de Discord solo Unicode.

Comportamiento.
  - Evento con emojis multiple extrae todos.
  - Evento sin emojis resultado vacio.
  - Evento con un emoji extrae ese emoji.

Nuevo toggle global en Slack settings.
  - useEventEmojisForStatus Bool false.

UI en Slack Settings.
  Section Calendario con Toggle Usar emojis del evento.

Logica de emoji en status.
  - Si useEventEmojisForStatus es true.
    - Extraer emojis del evento.
    - Si emojis isEmpty NO mostrar emoji status sin emoji.
    - Si emojis isNotEmpty usar emojis concatenados como emoji de status.
  - Si useEventEmojisForStatus es false.
    - Comportamiento actual usar emoji del FocusMode.

### 4. Configuracion global Slack

Nueva seccion en Slack Settings.
  - Calendario.
    - Toggle Mostrar titulo del evento.
    - Toggle Activar DND para video calls.
    - Toggle Usar emojis del evento.

Nuevo modelo SlackCalendarSettings.
  - showEventTitle Bool false.
  - activateDNDForVideoCalls Bool false.
  - useEventEmojisForStatus Bool false.

### 5. Comportamiento default

Sin configuracion nueva.
  - Mostrar emoji del FocusMode y En reunion.
  - Sin deteccion de video calls.
  - Sin emojis del evento.

Con configuracion.
  - Respetar los toggles globales.
  - Per FocusMode control de mostrar titulo.

