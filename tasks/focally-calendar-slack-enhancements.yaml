## Notes

  - Los emojis de Discord NO se extraen solo Unicode.
  - Si el evento no tiene emojis y useEventEmojisForStatus es true no se muestra emoji no fallback.
  - La deteccion de video calls es best effort puede tener falsos positivos negativos.
  - Los settings globales de Slack se aplican a todos los eventos independientemente del FocusMode.

