## Test cases

### Test 1 Video call detection
  - Evento Team Standup zoom link isVideoCall es true.
  - Evento In-person meeting isVideoCall es false.
  - Evento 1:1 Video Review isVideoCall es true.

### Test 2 Emoji extraction
  - Evento con emojis extrae correctamente.
  - Evento sin emojis vacio.
  - Evento con un emoji extrae ese emoji.

### Test 3 Title display behavior
  - showFullTitle muestra titulo completo.
  - showVideoCallOnly video call muestra En video llamada.
  - showVideoCallOnly in-person muestra En reunion.
  - hideTitle nil.

### Test 4 DND activation
  - activateDNDForVideoCalls es true y video call DND activado.
  - activateDNDForVideoCalls es true e in-person DND NO activado.
  - activateDNDForVideoCalls es false comportamiento actual.

## Migration plan

Backward compatibility.
  - calendarTitleDisplay default hideTitle no title.
  - calendarSettings defaults all false comportamiento actual.

No requiere migration code defaults preservan comportamiento actual.

## Security and Privacy considerations

  - EventKit permissions ya implementadas.
  - Solo lectura de eventos no modificacion.
  - URLs solo para deteccion no se envian a Slack.

## Dependencies

  - EventKit ya existente.
  - Sin dependencias externas nuevas.

## Performance considerations

  - Emoji extraction O n donde n es length of title tipico menos 100 chars.
  - Video call detection O 1 checks.
  - Calendar polling sin cambios.

## Rollback plan

Si hay bugs criticos.
  - Deshabilitar toggles nuevos default a false.
  - Revertir comportamiento actual en FocusTimerService.
  - Hotfix release v0.9.4.1.

