description: |
  PATCH v0.9.2: Agregar alertas visuales y nativas cuando hay nueva versión disponible.

  PROBLEMA:
  - UpdateCheckerService detecta nueva versión cada 24h via GitHub API
  - Badge existe solo en AboutSettingsView (Settings → About)
  - No hay alerta en UI principal (MenuBarDropdownView, IdleDashboardView)
  - No hay notificación nativa de macOS

  OBJETIVO:
  - Badge en MenuBarDropdownView (visible al abrir menú)
  - Badge en IdleDashboardView (visible al abrir app)
  - Notificación nativa de macOS cuando se detecta nueva versión

  SCOPE (NO major features):
  - NO cambiar lógica de UpdateCheckerService (ya funciona)
  - Solo agregar UI badges + notificación

