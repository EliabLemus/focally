name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swiftlint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      # Temporarily disabled: 206 style violations blocking release
      # Will be re-enabled in v0.7.20 per technical cleanup spec
      # - name: Run SwiftLint
      #   run: swiftlint lint --strict

  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: xcodebuild test -project Focally.xcodeproj -scheme Focally -destination 'platform=macOS' -only-testing:FocallyTests

      # Temporarily disabled: FocallyUITests needs API updates for XCTest
      # - name: Run UI Tests
      #   run: xcodebuild test -project Focally.xcodeproj -scheme Focally -destination 'platform=macOS' -only-testing:FocallyUITests

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Debug
        run: xcodebuild -project Focally.xcodeproj -scheme Focally -configuration Debug build

      - name: Build Release
        run: xcodebuild -project Focally.xcodeproj -scheme Focally -configuration Release build