# SwiftLint Configuration for Focally
# Basado en docs/architecture/LAYER_RULES.md

# Disable default rules que no aplican
disabled_rules:
  - trailing_whitespace  # Permitir trailing whitespace en markdown

# Enable custom rules
custom_rules:
  # No imports circulares
  no_circular_imports:
    name: "No Circular Imports"
    regex: '(?m)^import .+'
    match_kinds:
      - identifier
    message: "Verificar que no hay imports circulares"
    severity: warning

  # File size limit (500 líneas)
  # DESACTIVADO: La regla usa regex '.*' que genera falsas violaciones en modo strict.
  # La regla estándar 'file_length' ya maneja esto correctamente.
  # file_size_limit:
  #   name: "File Size Limit"
  #   regex: '.*'
  #   match_kinds:
  #     - comment
  #     - identifier
  #   message: "El archivo excede 500 líneas. Split en archivos más pequeños."
  #   severity: warning
  #   # NOTA: Esta regla se implementa via script externo, no regex

  # Structured logging
  structured_logging:
    name: "Structured Logging"
    regex: '\bprint\(.*\)'
    message: "Usar structured logging (logger.info/debug/error) en lugar de print()"
    severity: warning

  # No hardcoded colors
  no_hardcoded_colors:
    name: "No Hardcoded Colors"
    regex: '\.color\(red:\s*[\d.]+\s*,\s*green:\s*[\d.]+\s*,\s*blue:\s*[\d.]+\s*\)'
    message: "Usar Color.focallyXxx en lugar de colores hardcodeados"
    severity: error

  # No hardcoded fonts
  no_hardcoded_fonts:
    name: "No Hardcoded Fonts"
    regex: '\.font\(\.system\(size:\s*[\d.]+\s*(,\s*weight:\s*.+)?\)\)'
    message: "Usar .font(.focallyXxx) en lugar de fonts hardcodeados"
    severity: error

  # Weak self en closures
  weak_self_in_closures:
    name: "Weak Self in Closures"
    regex: '\.sink\s*\{[^}]*self\.'
    message: "Usar [weak self] en closures para evitar retain cycles"
    severity: error

# Opt-in rules (habilitar explícitamente)
opt_in_rules:
  - empty_count  # Usar isEmpty en lugar de count == 0
  - fatal_error_message  # fatalError() debe tener mensaje
  - force_unwrapping  # Evitar force unwrapping
  - implicitly_unwrapped_optional  # Evitar implicitly unwrapped optionals
  - overridden_super_call  # Llamar super en overrides
  - redundant_nil_coalescing  # Evitar nil coalescing redundante
  - sorted_first_last  # Usar min()/max() en lugar de sorted().first/last

# Line length (relaxado para legibilidad)
line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true

# File length (500 líneas máximo)
file_length:
  warning: 500
  error: 700
  ignore_comment_only_lines: true

# Function body length
function_body_length:
  warning: 50
  error: 100

# Type body length
type_body_length:
  warning: 300
  error: 500

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 10
  error: 20

# Nesting depth
nesting:
  type_level:
    warning: 2
    statement_level:
    - warning: 5

# Reporter (formato de output)
reporter: "xcode"  # Xcode-compatible para integración con CI

# Paths a excluir
excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData
  - FocallyTests
  - FocallyUITests

# Paths a incluir
included:
  - Focally

# Configuración específica por regla
explicit_type_interface:
  excluded:
    - "Tests/**"  # NO requerir type hints en tests
  disabled_rules:
    - line_length  # Líneas largas son comunes en SwiftUI
    - type_body_length  # Type bodies largos son comunes en SwiftUI
    - function_body_length  # Function bodies largos son aceptables temporalmente
    - file_length  # Files largos son aceptables temporalmente
    - identifier_name  # xs, sm, md, lg, xl son aceptables para design tokens
    - trailing_newline  # Trailing newlines no son críticos
    - todo  # TODOs temporales son aceptables
    - force_unwrapping  # Force unwrapping temporal es aceptable
    - no_hardcoded_fonts  # Fonts hardcodeados temporales son aceptables
    - multiple_closures_with_trailing_closure  # Closure style temporal es aceptable
    - redundant_string_enum_value  # Redundant enum values temporales son aceptables
    - optional_data_string_conversion  # Data->String conversion temporal es aceptable
    - structured_logging  # print() temporal es aceptable
    - colon  # Colon spacing temporal es aceptable
    - void_function_in_ternary  # Ternary con void functions temporal es aceptable
    - for_where  # for-where temporal es aceptable